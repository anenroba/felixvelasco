<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix Velasco E81</title>
    <style>
        /* Estilos para el cuerpo de la página */
        body, html {
            height: 100%; /* Asegura que el body y html ocupen toda la altura */
            margin: 0;
            font-family: sans-serif;
            color: white; /* Color de texto blanco para que contraste con el fondo */
        }

        .background-container {
            /* Establece la imagen de fondo */
            background-image: url('fondo-felix-velasco.png');

            /* Propiedades para asegurar que la imagen cubra todo el fondo */
            height: 100%; /* Ocupa toda la altura disponible */
            background-position: center; /* Centra la imagen */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-size: cover; /* Escala la imagen para cubrir todo el contenedor */
            background-attachment: fixed; /* Fija la imagen para que no se desplace con el scroll */
        }

        /* Contenedor central para los botones */
        .content {
            background-color: rgba(0, 0, 0, 0.5); /* Fondo semitransparente para el texto */
            text-align: center;
            padding: 40px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 15px;
            width: 80%;
            max-width: 400px; /* Un ancho máximo para que no se estire demasiado en pantallas grandes */
        }

        /* Estilos para los botones */
        .btn {
            display: block; /* Para que cada botón ocupe una línea */
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 20px;
            margin-bottom: 15px; /* Espacio entre botones */
            border-radius: 10px;
            text-decoration: none; /* Quita el subrayado de los enlaces */
            font-size: 18px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: background-color 0.3s ease; /* Transición suave para el hover */
        }

        .btn:last-child {
            margin-bottom: 0; /* Quita el margen del último botón */
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.4); /* Cambia de color al pasar el ratón */
        }
    </style>
</head>
<body>

    <div class="background-container">
        <!-- Contenedor para los botones -->
        <div class="content">
            <a href="#" class="btn">Instagram</a>
            <a href="#" class="btn">Whatsapp</a>
            <a href="#" class="btn">Web</a>
            <a href="#" class="btn">Aportes</a>
        </div>
    </div>

</body>
</html>
