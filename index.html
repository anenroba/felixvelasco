<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix Velasco E81</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Página oficial de Félix Velasco E81. Encuentra los enlaces a mis redes sociales, sitio web y cómo aportar a la campaña.">
    <meta name="keywords" content="Felix Velasco, candidato, E81, política, Chile">
    
    <!-- Open Graph Meta Tags (para compartir en redes sociales) -->
    <meta property="og:title" content="Felix Velasco E81">
    <meta property="og:description" content="Página de enlaces oficial de Félix Velasco E81.">
    <meta property="og:image" content="fondo-felix-velasco.png">
    <meta property="og:url" content="https://www.felixvelasco.cl"> <!-- Cambia esto si la URL final es otra -->

    <!-- Favicon -->
    <!-- Reemplaza 'favicon.ico' con la ruta a tu propio icono -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Se añade Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" xintegrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        /* Estilos para el cuerpo de la página */
        body, html {
            height: 100%; /* Asegura que el body y html ocupen toda la altura */
            margin: 0;
            font-family: sans-serif;
            color: white; /* Color de texto blanco para que contraste con el fondo */
        }

        .background-container {
            /* Establece la imagen de fondo */
            background-image: url('fondo-felix-velasco.png');

            /* Propiedades para asegurar que la imagen cubra todo el fondo */
            height: 100%; /* Ocupa toda la altura disponible */
            background-position: center; /* Centra la imagen */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-size: cover; /* Escala la imagen para cubrir todo el contenedor */
            background-attachment: fixed; /* Fija la imagen para que no se desplace con el scroll */
        }

        /* Contenedor central para los botones */
        .content {
            /* Se hace el contenedor transparente */
            background-color: transparent;
            text-align: center;
            padding: 40px 20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 150px; /* Ancho máximo reducido a la mitad */
        }

        /* Estilos generales para los botones */
        .btn {
            display: flex; /* Se usa flex para alinear icono y texto */
            align-items: center;
            justify-content: center;
            color: white;
            padding: 15px 20px;
            margin-bottom: 15px; /* Espacio entre botones */
            border-radius: 10px;
            text-decoration: none; /* Quita el subrayado de los enlaces */
            font-size: 18px;
            font-weight: bold;
            border: none; /* Se quita el borde */
            transition: transform 0.2s ease, box-shadow 0.2s ease; /* Transición suave para el hover */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px); /* Efecto de levantar el botón */
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:last-child {
            margin-bottom: 0; /* Quita el margen del último botón */
        }

        /* Estilos para el icono dentro del botón */
        .btn i {
            margin-right: 12px; /* Espacio entre el icono y el texto */
            font-size: 22px;
        }

        /* Colores específicos para cada botón */
        .btn.instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .btn.whatsapp {
            background-color: #25D366;
        }
        .btn.web {
            background-color: #007bff;
        }
        .btn.aportes {
            background-color: #FFC107;
        }
    </style>
</head>
<body>

    <div class="background-container">
        <!-- Contenedor para los botones -->
        <div class="content">
            <a href="https://www.instagram.com/felixuls" target="_blank" class="btn instagram"><i class="fa-brands fa-instagram"></i>Instagram</a>
            <a href="https://wa.me/56963495059" target="_blank" class="btn whatsapp"><i class="fa-brands fa-whatsapp"></i>Whatsapp</a>
            <a href="https://felixvelasco.cl/" target="_blank" class="btn web"><i class="fa-solid fa-globe"></i>Web</a>
            <a href="https://aportes.servel.cl/servel-aportes/inicio.xhtml?preloadId=Q0FOXzU3MQ==" target="_blank" class="btn aportes"><i class="fa-solid fa-hand-holding-dollar"></i>Aportes</a>
        </div>
    </div>

</body>
</html>
