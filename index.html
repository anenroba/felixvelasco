<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Félix Velasco - Enlaces</title>
    <!-- Incluyendo Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Estilos Generales */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; /* Evita el scroll */
        }

        /* Contenedor principal con la imagen de fondo */
        .container {
            /* Se utiliza la imagen que subiste como fondo */
            background-image: url('fondo-felix-velasco.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh; /* Ocupa toda la altura de la pantalla */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Alinea los elementos al final (abajo) */
            align-items: center; /* Centra los elementos horizontalmente */
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Contenedor de los enlaces */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 18px; /* Espacio entre los botones */
            width: 100%;
            max-width: 450px; /* Ancho máximo para los botones */
        }

        /* Estilo de cada botón */
        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.95); /* Fondo blanco semi-transparente */
            color: #1a202c; /* Color de texto oscuro */
            padding: 16px;
            text-decoration: none;
            border-radius: 30px; /* Bordes redondeados */
            font-weight: 600;
            font-size: 1.1em;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .link-button:hover {
            transform: scale(1.05); /* Aumenta el tamaño al pasar el mouse */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Iconos dentro de los botones */
        .link-button i {
            margin-right: 12px;
            font-size: 1.4em;
            width: 25px; /* Ancho fijo para alinear el texto */
        }

        /* Colores de marca para cada icono */
        .fa-instagram { color: #E4405F; }
        .fa-whatsapp { color: #25D366; }
        .fa-globe { color: #007BFF; }
        .fa-hand-holding-dollar { color: #209E3A; }

    </style>
</head>
<body>

    <div class="container">
        <div class="links-container">
            <!-- Botón de Instagram -->
            <a href="#" class="link-button" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <!-- Botón de WhatsApp -->
            <a href="#" class="link-button" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>

            <!-- Botón de Página Web -->
            <a href="#" class="link-button" target="_blank">
                <i class="fas fa-globe"></i>
                <span>Página Web</span>
            </a>

            <!-- Botón de Aportes -->
            <a href="#" class="link-button" target="_blank">
                <i class="fas fa-hand-holding-dollar"></i>
                <span>Aportes</span>
            </a>
        </div>
    </div>

</body>
</html>
